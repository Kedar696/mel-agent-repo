# Deployment for the MEL Survey Agent API on Digital Green's EKS cluster.
# DEFINITION ONLY - never applied from this repo.
#
# replicas: 1 on purpose. The API keeps its scheduler state (weekly-cap ledger, opt-out list,
# queue) in process memory, so a second replica would hold a different, inconsistent state and
# the two would disagree about what is due. Scaling out needs the shared store that
# infra/README.md lists as production-only (RDS); until then, one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mel-survey-agent-api
  labels:
    app: mel-survey-agent-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mel-survey-agent-api
  template:
    metadata:
      labels:
        app: mel-survey-agent-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          # Replace with the pushed image, e.g. <account>.dkr.ecr.<region>.amazonaws.com/mel-survey-agent-api:latest
          image: mel-survey-agent-api:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MEL_OUT_DIR
              value: /tmp/mel_out
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # /tmp writable even with a read-only root filesystem (MEL_OUT_DIR lives here).
        - name: tmp
          emptyDir: {}
