# Service that fronts the API Deployment on EKS.
# DEFINITION ONLY - never applied from this repo.
#
# type: ClusterIP keeps it internal. To expose it publicly on EKS, front it with an Ingress
# (ALB Ingress Controller) or change the type to LoadBalancer; left internal here so nothing is
# accidentally made public on apply.
apiVersion: v1
kind: Service
metadata:
  name: mel-survey-agent-api
  labels:
    app: mel-survey-agent-api
spec:
  type: ClusterIP
  selector:
    app: mel-survey-agent-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
