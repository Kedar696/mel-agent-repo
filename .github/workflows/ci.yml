name: CI
# P1 owns this. Keep main green: run the whole test suite, then prove a batch run
# writes schema-valid output, scores against the golden set, and that the Excel
# workbooks and JSON/CSV in the committed pack still agree.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Batch run
        run: python -m mel.cli run --simulate
      - name: Validate output
        run: python -m mel.cli validate
      - name: Golden-set scores
        run: python -m mel.cli eval
      - name: Excel and JSON parity
        run: python -m mel.cli parity
      - name: Build the API image
        run: docker build -t mel-survey-agent-api:ci .
      - name: Smoke-test the API image (/healthz)
        run: |
          docker run -d --name mel-api-ci -p 8000:8000 mel-survey-agent-api:ci
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:8000/healthz; then ok=1; break; fi
            sleep 1
          done
          docker logs mel-api-ci
          docker rm -f mel-api-ci
          test "${ok:-0}" = "1"
