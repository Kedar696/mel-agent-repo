name: CI
# P1 owns this. Keep main green: run the whole test suite, then prove a batch run
# writes schema-valid output, scores against the golden set, and that the Excel
# workbooks and JSON/CSV in the committed pack still agree.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint (ruff, rules in pyproject.toml)
        run: ruff check
      - name: Run tests
        run: pytest -q
      - name: Batch run
        run: python -m mel.cli run --simulate
      - name: Validate output
        run: python -m mel.cli validate
      - name: Golden-set scores
        run: python -m mel.cli eval
      - name: Excel and JSON parity
        run: python -m mel.cli parity
      - name: Build the API image
        run: docker build --target api -t mel-survey-agent-api:ci .
      - name: Smoke-test the API image (/healthz)
        run: |
          docker run -d --name mel-api-ci -p 8000:8000 -e MEL_API_TOKEN=ci mel-survey-agent-api:ci
          for i in $(seq 1 20); do
            if curl -fs http://127.0.0.1:8000/healthz; then ok=1; break; fi
            sleep 1
          done
          docker logs mel-api-ci
          docker rm -f mel-api-ci
          test "${ok:-0}" = "1"
      - name: Build the UI image
        run: docker build --target ui -t mel-survey-agent-ui:ci .
      - name: Smoke-test the UI image (/_stcore/health)
        run: |
          docker run -d --name mel-ui-ci -p 8501:8501 mel-survey-agent-ui:ci
          for i in $(seq 1 40); do
            if curl -fs http://127.0.0.1:8501/_stcore/health; then ok=1; break; fi
            sleep 1
          done
          docker logs mel-ui-ci
          docker rm -f mel-ui-ci
          test "${ok:-0}" = "1"
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - name: Format
        run: terraform fmt -check -diff
      - name: Init (no backend, no AWS)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
