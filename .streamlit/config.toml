# FarmerChat-aligned theme (farmer.chat, 4 Nov): mint page, white cards, deep green actions, bright green
# accents, zinc grays, Inter with system Devanagari fallbacks. app/theme.py carries the CSS half.
[theme]
base = "light"
primaryColor = "#008236"
backgroundColor = "#F1F7F2"
secondaryBackgroundColor = "#E6EFE8"
textColor = "#18181B"
linkColor = "#008236"
borderColor = "#E4E4E7"
dataframeBorderColor = "#E4E4E7"
dataframeHeaderBackgroundColor = "#E6EFE8"
codeBackgroundColor = "#F4F4F5"
codeTextColor = "#18181B"
redColor = "#E5533D"
orangeColor = "#F59E0B"
yellowColor = "#FFC400"
greenColor = "#008236"
blueColor = "#00BCFF"
grayColor = "#52525C"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, 'Noto Sans Devanagari', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', sans-serif"
baseFontSize = 17
headingFontSizes = ["1.9rem", "1.45rem", "1.2rem", "1.05rem", "1rem", "0.95rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "1.7rem"
metricValueFontWeight = 700
baseRadius = "1.1rem"
buttonRadius = "full"
paddingTop = "1rem"
paddingBottom = "4rem"
chartCategoricalColors = ["#008236", "#00C950", "#FFC400", "#E5533D", "#00BCFF", "#52525C"]

[browser]
gatherUsageStats = false
