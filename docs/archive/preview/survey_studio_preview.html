<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survey Studio Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Bricolage+Grotesque:wght@600;700&display=swap">
<style>
/* Layout: three columns on desktop (insights | what happened | phone), stacked on phones. Field-station look: slate-green neutrals, leaf accent. */
:root{--bg:#EEF2EE;--panel:#FFFFFF;--ink:#16221B;--muted:#5A6B61;--line:#D3DCD5;--accent:#1D7A4C;--accent-ink:#FFFFFF;--soft:#E1EFE6;--warn:#B4540A;--warn-soft:#FBEBDD;--bubble-in:#FFFFFF;--bubble-out:#D8F0DE;--wa:#E7E1D6;
--f-display:'Bricolage Grotesque','Mukta',system-ui,sans-serif;--f-body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1612;--panel:#17211B;--ink:#E7EFE9;--muted:#93A69A;--line:#2A382F;--accent:#4CC48A;--accent-ink:#06210F;--soft:#1E3326;--warn:#F0A064;--warn-soft:#3A2A1A;--bubble-in:#1F2C24;--bubble-out:#24523A;--wa:#16201A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1612;--panel:#17211B;--ink:#E7EFE9;--muted:#93A69A;--line:#2A382F;--accent:#4CC48A;--accent-ink:#06210F;--soft:#1E3326;--warn:#F0A064;--warn-soft:#3A2A1A;--bubble-in:#1F2C24;--bubble-out:#24523A;--wa:#16201A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;margin-bottom:18px}
h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.01em}
.tag{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr) 400px;gap:18px;align-items:start}
@media(max-width:1020px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font-family:var(--f-display);font-size:15px;margin:0 0 10px;letter-spacing:.01em}
.label{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 10px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:420px;overflow:auto}
.item{text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer;min-width:0}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--soft);border-color:var(--accent)}
.item b{display:block;font-size:14px}.item span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.q{margin:0 0 4px;font-weight:700}.a{margin:0 0 12px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.meta div{border-top:1px solid var(--line);padding-top:6px}
.meta dt{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.meta dd{margin:0;font-weight:500}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.qlist{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.qlist li{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.qlist .t{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.qlist .p{font-weight:700;margin:2px 0 6px}
.qlist .o{display:flex;flex-wrap:wrap;gap:6px}.qlist .o span{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:13px}
.qlist .o span.fu{border-color:var(--warn);color:var(--warn)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.phone{background:#0D130F;border-radius:30px;padding:10px;border:1px solid var(--line);max-width:380px;margin:0 auto}
.screen{background:var(--panel);border-radius:22px;min-height:520px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.screen.wa{background:var(--wa)}
.appbar{padding:14px 16px;font-family:var(--f-display);font-size:15px;border-bottom:1px solid var(--line)}
.scrim{flex:1;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.sheet{background:var(--panel);border-radius:18px 18px 0 0;padding:16px;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.sheet h3{font-family:var(--f-display);font-size:15px;margin:0 0 2px}
.step{color:var(--muted);font-size:13px;margin-bottom:6px}
.bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.sheet .prompt{font-size:19px;font-weight:700;line-height:1.35;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 12px;border-radius:10px;font:inherit;font-size:16px;cursor:pointer;text-align:center}
.opt:hover{border-color:var(--accent);background:var(--soft)}
.scale{display:flex;gap:6px}.scale .opt{flex:1;padding:11px 0}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.thanks{padding:40px 20px;text-align:center}.thanks p{margin:6px 0}
.chat{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.bub{max-width:86%;padding:8px 11px;border-radius:10px;background:var(--bubble-in);box-shadow:0 1px 0 var(--line)}
.bub.me{align-self:flex-end;background:var(--bubble-out)}
.btnrow{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.wbtn{border:1px solid var(--line);background:var(--panel);color:var(--accent);font:inherit;font-weight:700;padding:8px;border-radius:9px;cursor:pointer}
.record{margin-top:14px;font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;overflow-x:auto}
.note{font-size:12px;color:var(--muted);margin-top:10px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Survey Studio Preview</h1>
    <span class="tag">P4 writer output · synthetic data · no real farmers</span>
  </header>
  <div class="grid">
    <aside class="panel">
      <h2>Pick an insight</h2>
      <div class="label">Advice type</div>
      <div class="chips" id="types"></div>
      <div class="list" id="list" role="listbox" aria-label="Insights"></div>
    </aside>
    <main class="panel" id="main"></main>
    <section class="panel">
      <div class="controls">
        <div class="seg" role="group" aria-label="Survey language"><button id="l-hi">हिन्दी</button><button id="l-en">English</button></div>
        <div class="seg" role="group" aria-label="Channel"><button id="c-app">App</button><button id="c-wa">WhatsApp</button></div>
      </div>
      <div id="phone"></div>
      <div class="record" id="record"></div>
      <p class="note">Tap the answers like a farmer would. A bad answer sets a follow-up flag and goes back to FarmerChat.</p>
    </section>
  </div>
</div>

function renderPhone(){
  const u = UI[S.lang], its = items(), n = its.length, p = $('phone'); p.replaceChildren();
  const ph = el('div','phone'), sc = el('div','screen' + (S.ch==='wa' ? ' wa' : '')); ph.append(sc); p.append(ph);
  if (S.ch === 'app') {
    sc.append(el('div','appbar',u.app), el('div','scrim'));
    const sh = el('div','sheet'); sc.append(sh);
    if (S.end) {
      const t = el('div','thanks');
      t.append(el('p','', S.end==='finished' ? u.thanks : S.end==='stopped' ? u.stopped : u.closed));
      if (S.end==='finished' && S.taps.some(x => x.f)) t.append(el('p','note',u.fu));
      const r = el('button','ghost',u.again); r.onclick = () => { reset(); renderAll(); }; t.append(r); sh.append(t); return;
    }
    const it = its[S.step];
    sh.append(el('h3','',u.title), el('div','step',u.of(S.step+1,n)));
    const bar = el('div','bar'); const i = el('i'); i.style.width = ((S.step+1)/n*100)+'%'; bar.append(i); sh.append(bar);
    sh.append(el('div','prompt',it.p)); sh.append(options(it));
    const f = el('div','foot'); const l = el('div'); l.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
    const sk = el('button','ghost',u.skip); sk.onclick = () => answer(null);
    const cl = el('button','ghost',u.close); cl.onclick = () => { S.end = 'closed'; renderPhone(); renderRecord(); };
    l.append(sk, cl); const st = el('button','ghost',u.stop); st.onclick = () => { S.end = 'stopped'; renderPhone(); renderRecord(); };
    f.append(l, st); sh.append(f);
  } else {
    const chat = el('div','chat'); sc.append(el('div','appbar','FarmerChat · WhatsApp'), chat);
    const shown = Math.min(S.step+1, n);
    for (let k = 0; k < shown; k++) {
      const it = its[k]; const b = el('div','bub'); b.append(el('div','',it.p));
      if (k === S.step && !S.end) b.append(options(it,true));
      chat.append(b);
      if (S.taps[k]) chat.append(el('div','bub me', S.taps[k].v === null ? '—' : S.taps[k].label));
    }
    if (S.end) { const t = el('div','bub', u.thanks); chat.append(t); if (S.taps.some(x => x.f)) chat.append(el('div','bub', u.fu)); const r = el('button','wbtn',u.again); r.onclick = () => { reset(); renderAll(); }; chat.append(r); }
  }
}
function options(it, wa){
  if (it.t === 'survey-scale') {
    const row = el('div','scale'); for (let v = it.sc[0]; v <= it.sc[1]; v++) { const b = el('button','opt',String(v)); b.onclick = () => { S.taps.push({v, label:String(v), f:null}); S.step++; if (S.step >= items().length) S.end='finished'; renderPhone(); renderRecord(); }; row.append(b); } return row;
  }
  const box = el('div', wa ? 'btnrow' : 'opts');
  it.o.forEach(x => { const b = el('button', wa ? 'wbtn' : 'opt', x.l); b.onclick = () => { S.taps.push({v:x.l, label:x.l, f:x.f}); S.step++; if (S.step >= items().length) S.end='finished'; renderPhone(); renderRecord(); }; box.append(b); });
  return box;
}
function renderRecord(){
  const r = $('record'); const flags = [...new Set(S.taps.filter(t => t.f).map(t => t.f))];
  const answered = S.taps.filter(t => t.v !== null).length;
  const status = S.end === 'stopped' ? 'declined (farmer_opted_out)' : S.end === 'closed' ? (answered ? 'partial (sheet closed partway)' : 'declined (sheet dismissed)') : !S.taps.length ? 'waiting for the farmer' : S.end === 'finished' ? (flags.length ? 'negative_outcome' : answered < items().length ? 'partial' : 'completed') : 'in progress';
  r.textContent = `answer record\nstatus: ${status}\nanswered: ${answered} of ${items().length}\nneeds_follow_up: ${flags.length ? 'yes' : 'no'}\nfollow_up_reasons: ${flags.length ? flags.join(', ') : 'none'}`;
}
function renderAll(){
  $('l-hi').setAttribute('aria-pressed', String(S.lang==='hi-IN')); $('l-en').setAttribute('aria-pressed', String(S.lang==='en-IN'));
  $('c-app').setAttribute('aria-pressed', String(S.ch==='app')); $('c-wa').setAttribute('aria-pressed', String(S.ch==='wa'));
  renderTypes(); renderList(); renderMain(); renderPhone(); renderRecord();
}
$('l-hi').onclick = () => { S.lang='hi-IN'; reset(); renderAll(); };
$('l-en').onclick = () => { S.lang='en-IN'; reset(); renderAll(); };
$('c-app').onclick = () => { S.ch='app'; reset(); renderAll(); };
$('c-wa').onclick = () => { S.ch='wa'; reset(); renderAll(); };
renderAll();
</script>
